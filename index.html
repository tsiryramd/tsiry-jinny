<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation — Tsiry & Jinny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<script src="config.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white:     #FDFCF8;
    --cream:     #F5F0E8;
    --gold:      #C9A84C;
    --gold-pale: #F0E4C2;
    --gold-deep: #9B7B2A;
    --text-dark: #1A1612;
    --text-mid:  #4A3F32;
    --text-light:#8A7A6A;
    --border:    rgba(201,168,76,0.25);
  }

  html, body { width:100%; height:100%; overflow:hidden; background:var(--white); font-family:'Jost',sans-serif; color:var(--text-dark); }

  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 60%);
  }

  /* PARTICLES */
  #particles { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .particle { position:absolute; border-radius:50%; background:var(--gold); opacity:0; animation:floatUp linear infinite; box-shadow:0 0 8px 2px rgba(201,168,76,0.5); }
  @keyframes floatUp {
    0%   { transform:translateY(0) translateX(0) scale(1); opacity:0; }
    10%  { opacity:0.65; }
    90%  { opacity:0.25; }
    100% { transform:translateY(-100vh) translateX(var(--dx)) scale(0.3); opacity:0; }
  }

  /* TWINKLE STARS */
  .twinkle { position:fixed; border-radius:50%; background:var(--gold); pointer-events:none; z-index:0; animation:twinkleAnim ease-in-out infinite; box-shadow:0 0 10px 3px rgba(201,168,76,0.55); }
  @keyframes twinkleAnim {
    0%,100% { opacity:0; transform:scale(0.4); }
    50%     { opacity:0.8; transform:scale(1.3); }
  }

  /* SLIDER */
  #slider { position:fixed; inset:0; z-index:1; overflow:hidden; }

  .slide {
    position:absolute; inset:0;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 32px 160px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    opacity:0; transform:translateY(50px);
    transition:opacity 1.4s cubic-bezier(0.4,0,0.2,1), transform 1.4s cubic-bezier(0.4,0,0.2,1);
    pointer-events:none;
  }
  .slide.active { opacity:1; transform:translateY(0); pointer-events:all; }

  .fade-child { opacity:0; }
  .slide.active .fade-child { animation:fadeChild 0.9s ease forwards; }
  .slide.active .fade-child:nth-child(1) { animation-delay:0.35s; }
  .slide.active .fade-child:nth-child(2) { animation-delay:0.6s; }
  .slide.active .fade-child:nth-child(3) { animation-delay:0.85s; }
  .slide.active .fade-child:nth-child(4) { animation-delay:1.1s; }
  .slide.active .fade-child:nth-child(5) { animation-delay:1.35s; }
  .slide.active .fade-child:nth-child(6) { animation-delay:1.6s; }
  @keyframes fadeChild {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .slide-inner { max-width:680px; width:100%; text-align:center; position:relative; }

  /* ORNAMENTS */
  .ornament { display:block; color:var(--gold); font-size:22px; letter-spacing:0.3em; opacity:0.7; margin-bottom:20px; }
  .ornament-line { display:flex; align-items:center; gap:16px; margin:24px auto; max-width:320px; }
  .ornament-line::before,.ornament-line::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .ornament-line-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(201,168,76,0.6); }

  /* TYPOGRAPHY */
  .heading-names { font-family:'Cormorant Garamond',serif; font-size:clamp(60px,11vw,96px); font-weight:500; line-height:1; letter-spacing:-0.01em; color:var(--text-dark); }
  .heading-names .amp { font-style:italic; color:var(--gold); font-size:0.75em; display:block; line-height:1.3; }
  .heading-serif { font-family:'Cormorant Garamond',serif; font-size:clamp(19px,3.4vw,27px); font-weight:500; font-style:italic; color:var(--text-mid); line-height:1.6; }
  .heading-label { font-family:'Jost',sans-serif; font-size:12px; font-weight:400; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold-deep); }
  .body-text { font-family:'Jost',sans-serif; font-size:clamp(15px,2.5vw,17px); font-weight:400; line-height:1.85; color:var(--text-mid); }
  .family-text { font-family:'Cormorant Garamond',serif; font-size:clamp(18.5px,2.5vw,27px); font-weight:500; line-height:1.7; color:var(--text-mid); white-space:pre-line; }
  .gold-text { color:var(--gold-deep); font-weight:600; }
  .big-date { font-family:'Cormorant Garamond',serif; font-size:clamp(32px,5.5vw,50px); font-weight:500; color:var(--text-dark); letter-spacing:0.05em; }

  /* CARDS */
  .card { background:rgba(255,255,255,0.85); border:1px solid var(--border); border-radius:2px; padding:32px 36px; position:relative; backdrop-filter:blur(4px); }
  .card::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; border:1px solid rgba(201,168,76,0.12); border-radius:1px; pointer-events:none; }

  /* FAMILY */
  .family-role { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:6px; opacity:0.8; }
  .family-layout { display:flex; gap:0; text-align:left; margin:24px 0; align-items:stretch; }
  .family-col { flex:1; padding:8px 0; overflow:hidden; }
  .family-col-right { padding-left:24px; }
  .family-sep-v { width:1px; flex-shrink:0; background:linear-gradient(180deg,transparent,var(--gold),transparent); opacity:0.4; }
  @media (max-width:540px) {
    .family-layout { flex-direction:column; }
    .family-sep-v { display:none; }
    .family-col-right { padding-left:0; border-top:1px solid var(--border); margin-top:14px; padding-top:8px; }
  }

  /* EVENT */
  .event-block { padding:20px 0; }
  .event-block + .event-block { border-top:1px solid var(--border); }

  /* CHECKLIST */
  .checklist { list-style:none; text-align:left; display:inline-block; margin:16px auto 0; }
  .checklist li { display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; font-family:'Jost',sans-serif; font-size:clamp(13px,2.2vw,15px); font-weight:300; color:var(--text-mid); line-height:1.5; }
  .checklist li .icon { flex-shrink:0; width:28px; height:28px; border:1px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; }

  /* COUNTDOWN */
  .countdown-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:28px 0; }
  .countdown-unit { display:flex; flex-direction:column; align-items:center; }
  .countdown-number { font-family:'Cormorant Garamond',serif; font-size:clamp(36px,8vw,64px); font-weight:300; color:var(--text-dark); line-height:1; min-width:2ch; text-align:center; transition:all 0.3s ease; }
  .countdown-label { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-deep); margin-top:8px; }

  /* GALLERY */
  .gallery-track { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; padding:8px 4px 16px; scrollbar-width:none; }
  .gallery-track::-webkit-scrollbar { display:none; }
  .gallery-item { flex:0 0 auto; width:180px; height:225px; scroll-snap-align:center; border-radius:2px; overflow:hidden; border:1px solid var(--border); }
  .gallery-item img { width:100%; height:100%; object-fit:cover; transition:transform 0.6s ease; cursor:zoom-in; }
  .gallery-item:hover img { transform:scale(1.04); }

  /* LIGHTBOX */
  #lightbox {
    display:none; position:fixed; inset:0; z-index:999;
    background:rgba(10,8,5,0.94);
    backdrop-filter:blur(8px);
    align-items:center; justify-content:center;
    animation:lbIn 0.3s ease;
  }
  #lightbox.open { display:flex; }
  @keyframes lbIn { from { opacity:0; } to { opacity:1; } }
  #lightbox img {
    max-width:92vw; max-height:88vh; object-fit:contain;
    border:1px solid rgba(201,168,76,0.25);
    border-radius:2px;
    box-shadow:0 24px 80px rgba(0,0,0,0.7);
    animation:lbImgIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes lbImgIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  #lightbox-close {
    position:fixed; top:18px; right:18px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(201,168,76,0.4);
    color:var(--gold-pale);
    font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease;
    z-index:1000;
  }
  #lightbox-close:hover { background:var(--gold); color:var(--text-dark); transform:scale(1.1); }
  #lightbox-prev, #lightbox-next {
    position:fixed; top:50%; transform:translateY(-50%);
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1.5px solid rgba(201,168,76,0.45);
    color:var(--gold-pale);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.22s ease; z-index:1000;
  }
  #lightbox-prev { left:16px; }
  #lightbox-next { right:16px; }
  #lightbox-prev:hover, #lightbox-next:hover { background:var(--gold); border-color:var(--gold); color:var(--text-dark); transform:translateY(-50%) scale(1.1); }
  #lightbox-prev:disabled, #lightbox-next:disabled { opacity:0.2; cursor:default; }
  #lightbox-prev:disabled:hover, #lightbox-next:disabled:hover { background:rgba(255,255,255,0.1); border-color:rgba(201,168,76,0.45); color:var(--gold-pale); transform:translateY(-50%) scale(1); }
  #lightbox-counter {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.25em;
    color:rgba(240,228,194,0.6); z-index:1000;
  }
  .gallery-hint { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold-deep); opacity:0.5; margin-top:4px; }
  .gallery-dots { display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .gallery-dot { width:5px; height:5px; border-radius:50%; background:var(--gold-pale); cursor:pointer; transition:all 0.3s; }
  .gallery-dot.active { background:var(--gold); width:16px; border-radius:3px; }

  /* GALLERY NAV BUTTONS */
  .gallery-nav-wrapper { position:relative; display:flex; align-items:center; gap:0; }
  .gallery-nav-btn {
    flex-shrink:0; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.97);
    border:2px solid var(--gold);
    color:var(--gold-deep);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.25s ease;
    box-shadow:0 4px 18px rgba(201,168,76,0.28), 0 0 0 4px rgba(201,168,76,0.10);
    z-index:5;
    position:relative;
  }
  .gallery-nav-btn svg { width:18px; height:18px; stroke-width:2; }
  .gallery-nav-btn:hover { background:var(--gold); color:white; border-color:var(--gold); transform:scale(1.12); box-shadow:0 6px 22px rgba(201,168,76,0.45), 0 0 0 6px rgba(201,168,76,0.15); }
  .gallery-nav-btn:disabled { opacity:0.25; cursor:default; transform:none; box-shadow:none; }
  @media (max-width:540px) { .gallery-nav-btn { display:none; } }

  /* NAV */
  #nav { position:fixed; bottom:36px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; gap:16px; }
  #progress { display:flex; gap:8px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold-pale); transition:all 0.4s ease; cursor:pointer; }
  .dot.active { background:var(--gold); width:22px; border-radius:3px; }

  #btn-next { display:flex; align-items:center; gap:10px; background:var(--text-dark); color:var(--gold-pale); border:none; font-family:'Jost',sans-serif; font-size:10px; font-weight:300; letter-spacing:0.35em; text-transform:uppercase; padding:14px 32px; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; }
  #btn-next::before { content:''; position:absolute; inset:0; background:var(--gold); transform:translateX(-101%); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); z-index:0; }
  #btn-next:hover::before { transform:translateX(0); }
  #btn-next span,#btn-next svg { position:relative; z-index:1; }
  #btn-next:hover { color:var(--text-dark); }
  #btn-next.hidden { opacity:0; pointer-events:none; transform:translateY(8px); }

  #btn-prev { display:flex; align-items:center; gap:10px; background:#FDFCF8; color:var(--text-dark); border:1px solid rgba(26,22,18,0.2); font-family:'Jost',sans-serif; font-size:10px; font-weight:300; letter-spacing:0.35em; text-transform:uppercase; padding:14px 24px; cursor:pointer; transition:all 0.3s ease; }
  #btn-prev:hover { border-color:var(--text-dark); background:var(--cream); }
  #btn-prev.hidden { opacity:0; pointer-events:none; }

  .arrow-icon { width:14px; height:14px; transition:transform 0.3s ease; }
  #btn-next:hover .arrow-icon { transform:translateX(4px); }

  .cover-badge { display:inline-block; padding:6px 20px; border:1px solid var(--border); font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:32px; background:rgba(201,168,76,0.04); }
  .swipe-hint { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-deep); opacity:0.5; margin-top:4px; }

  /* RESPONSIVE */
  @media (max-width:540px) {
    .slide { padding:24px 16px 140px; }
    .slide-inner { padding-top:16px; }
    .card { padding:20px 16px; }
    .heading-serif { font-size:clamp(17px,4vw,22px); }
    .gallery-item { width:160px; height:200px; }

    /* Familles */
    .family-text { font-size:15px; line-height:1.6; }
    .family-role { font-size:11px; }

    /* Dates & lieux */
    .big-date { font-size:clamp(26px,6.5vw,36px); }
    .body-text { font-size:15px; }

    /* Compte a rebours 2x2 */
    .countdown-grid { grid-template-columns:repeat(2,1fr); gap:20px 28px; margin:20px 0; }
    .countdown-number { font-size:clamp(42px,11vw,56px); }
    .countdown-label { font-size:10px; }

    /* Preparez-vous colonne unique */
    .prepare-grid { grid-template-columns:1fr !important; gap:20px !important; }
    .prepare-col-mid { border-left:none !important; border-right:none !important; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:16px 0 !important; }
    .prepare-item-label { font-size:12px !important; }
    .prepare-item-text  { font-size:14px !important; }

    /* Dress Code */
    .dress-card { padding:8px 16px !important; }
    .dress-colors { font-size:11px !important; letter-spacing:0.08em !important; }
    .dress-heading { font-size:9px !important; }

    /* RSVP */
    .rsvp-text { font-size:15px !important; line-height:1.9; }
  }
</style>
</head>
<body>

<div id="particles"></div>
<div id="slider"></div>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Vue agrandie">
  <button id="lightbox-close" aria-label="Fermer">✕</button>
  <img id="lightbox-img" src="" alt="Photo agrandie">
  <button id="lightbox-prev" aria-label="Photo précédente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <button id="lightbox-next" aria-label="Photo suivante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <div id="lightbox-counter"></div>
</div>

<nav id="nav">
  <div id="progress"></div>
  <div style="display:flex;gap:12px;align-items:center;">
    <button id="btn-prev">
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <span>Précédent</span>
    </button>
    <button id="btn-next">
      <span>Suivant</span>
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="swipe-hint" id="swipe-hint">Glissez pour continuer</div>
</nav>

<script>
(function(){
  const C = WEDDING_CONFIG;

  // PARTICLES
  const pc = document.getElementById('particles');
  for(let i=0;i<32;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*5+3;
    const dx=(Math.random()-0.5)*140;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*20}%;animation-duration:${Math.random()*16+10}s;animation-delay:${Math.random()*-22}s;--dx:${dx}px;`;
    pc.appendChild(p);
  }
  // Twinkle stars fixes
  for(let i=0;i<12;i++){
    const t=document.createElement('div');
    t.className='twinkle';
    const s=Math.random()*3+2;
    t.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*-4}s;`;
    pc.appendChild(t);
  }

  function orn(){ return `<div class="ornament-line"><div class="ornament-line-dot"></div></div>`; }

  // GALLERY IMAGES
  const galleryImages = C.galleryImages || [
    'DSC08336.jpg','DSC08355.jpg','DSC08592.jpg','DSC08776.jpg',
    'DSC08875.jpg','DSC08913.jpg','DSC09029.jpg','DSC08335.jpg',
    'DSC08419.jpg','DSC08748.jpg','DSC08753.jpg'
  ];

  const slides = [

    // 1 — COVER
    `<div class="slide-inner" style="position:relative;">
      ${C.coverImage?`<div style="position:fixed;inset:0;z-index:-1;background-image:url('${C.coverImage}');background-size:contain;background-position:center 55%;opacity:0.13;filter:grayscale(30%);"></div>`:''}
      <div class="cover-badge fade-child">Invitation</div>
      <div class="heading-names fade-child">${C.groom}<br><span class="amp">&amp;</span>${C.bride}</div>
      ${orn()}
      <p class="heading-label fade-child" style="margin-top:8px;margin-bottom:20px;font-size:15px;letter-spacing:0.25em;">Nous vous convions à notre célébration</p>
      <blockquote class="fade-child cover-blockquote" style="max-width:480px;margin:0 auto;font-family:'Cormorant Garamond',serif;font-size:clamp(15px,4.5vw,18px);font-style:italic;font-weight:400;color:var(--text-mid);line-height:1.9;border-left:2px solid var(--gold);padding:14px 0 14px 22px;text-align:left;">
        « L'amour est patient, l'amour est serviable. Il n'est ni envieux, ni porté à l'orgueil. Il ne se vante pas, ne se gonfle pas d'orgueil, ne fait rien d'inconvenant, ne cherche pas son intérêt, ne s'irrite pas, ne garde pas souvenir du mal… »
        <br><span style="display:block;margin-top:10px;font-style:normal;font-size:0.85em;letter-spacing:0.15em;color:var(--gold-deep);">— 1 Corinthiens 13, 4‑7</span>
      </blockquote>
    </div>`,

    // 2 — FAMILLES
    `<div class="slide-inner">
      <div class="card">
        <!-- Parents row -->
        <div class="family-layout">
          <div class="family-col fade-child">
            <div class="family-role">Côté marié</div>
            <p class="family-text">${C.families.left.parents}</p>
          </div>
          <div class="family-sep-v"></div>
          <div class="family-col family-col-right fade-child">
            <div class="family-role">Côté mariée</div>
            <p class="family-text">${C.families.right.parents}</p>
          </div>
        </div>
        ${orn()}
        <!-- Children row -->
        <div class="family-layout">
          <div class="family-col fade-child">
            <p class="family-text" style="font-style:italic">${C.families.left.child}</p>
            <p class="family-text" style="font-style:italic">${C.families.left.partner}</p>
          </div>
          <div class="family-sep-v"></div>
          <div class="family-col family-col-right fade-child">
            <p class="family-text" style="font-style:italic">${C.families.right.child}</p>
            <p class="family-text" style="font-style:italic">${C.families.right.partner}</p>
          </div>
        </div>
        ${orn()}
        <p class="heading-serif fade-child" style="font-size:clamp(22px,3.2vw,30px);font-style:normal;font-weight:500;color:var(--text-dark);line-height:1.7;">Ont l'honneur de vous inviter à la bénédiction par le mariage religieux de leurs enfants et petits-enfants,</p>
        <p class="heading-names fade-child" style="font-size:clamp(36px,6vw,56px);margin-top:16px">${C.groom} <span class="amp" style="display:inline;font-size:0.75em">&amp;</span> ${C.bride}</p>
      </div>
    </div>`,

    // 3 — DATE & LIEU
    `<div class="slide-inner">
      <span class="ornament fade-child">✦</span>
      <p class="heading-label fade-child" style="margin-bottom:24px">Au programme</p>
      <div class="card fade-child">
        <div class="event-block">
          <p class="heading-label" style="margin-bottom:12px">La Bénédiction</p>
          <p class="big-date">${C.ceremony.date || 'Vendredi 21 Août 2026'}</p>
          <p class="body-text" style="margin-top:12px"><span class="gold-text">${C.ceremony.church || 'FJKM Arivonimamo'}</span><br>à ${C.ceremony.churchTime || '10h00'}</p>
        </div>
        <div class="event-block">
          <p class="heading-label" style="margin-bottom:12px">La Réception</p>

    </div>`,

    // 4 — COMPTE À REBOURS
    `<div class="slide-inner">
      <span class="ornament fade-child">✦</span>
      <p class="heading-label fade-child" style="margin-bottom:8px">Plus que</p>
      ${orn()}
      <div class="countdown-grid fade-child">
        <div class="countdown-unit"><div class="countdown-number" id="cd-days">--</div><div class="countdown-label">Jours</div></div>
        <div class="countdown-unit"><div class="countdown-number" id="cd-hours">--</div><div class="countdown-label">Heures</div></div>
        <div class="countdown-unit"><div class="countdown-number" id="cd-min">--</div><div class="countdown-label">Minutes</div></div>
        <div class="countdown-unit"><div class="countdown-number" id="cd-sec">--</div><div class="countdown-label">Secondes</div></div>
      </div>
      ${orn()}
      <p class="heading-serif fade-child">avant de célébrer</p>
      <p class="heading-names fade-child" style="font-size:clamp(36px,6vw,56px);margin-top:8px">${C.groom} <span class="amp" style="display:inline;font-size:0.75em">&amp;</span> ${C.bride}</p>
    </div>`,

    // 5 — PRÉPAREZ-VOUS
    `<div class="slide-inner">
      <span class="ornament fade-child">✦</span>
      <p class="heading-label fade-child" style="margin-bottom:4px">Ce qu'il faut préparer</p>
      ${orn()}
      <div class="card fade-child">
        <div class="prepare-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;text-align:center;padding:8px 0;">
          <div>
            <div style="font-size:36px;margin-bottom:14px">🍽</div>
            <p class="heading-label prepare-item-label" style="margin-bottom:6px;font-size:10px;">Votre estomac</p>
            <p class="body-text prepare-item-text" style="font-size:13px;color:var(--text-light);"><em style="color:var(--gold-deep);font-style:italic;font-weight:400;">car</em> il y aura à manger</p>
          </div>
          <div class="prepare-col-mid" style="border-left:1px solid var(--border);border-right:1px solid var(--border);">
            <div style="font-size:36px;margin-bottom:14px">💃</div>
            <p class="heading-label prepare-item-label" style="margin-bottom:6px;font-size:10px;">Votre corps</p>
            <p class="body-text prepare-item-text" style="font-size:13px;color:var(--text-light);"><em style="color:var(--gold-deep);font-style:italic;font-weight:400;">car</em> il faudra danser</p>
          </div>
          <div>
            <div style="font-size:36px;margin-bottom:14px">✨</div>
            <p class="heading-label prepare-item-label" style="margin-bottom:6px;font-size:10px;">Votre joie de vivre</p>
            <p class="body-text prepare-item-text" style="font-size:13px;color:var(--text-light);"><em style="color:var(--gold-deep);font-style:italic;font-weight:400;">car</em> nous allons célébrer</p>
          </div>
        </div>
      </div>
    </div>`,

    // 6 — GALERIE
    `<div class="slide-inner">
      <span class="ornament fade-child">✦</span>
      <p class="heading-label fade-child" style="margin-bottom:4px">Nos souvenirs</p>
      ${orn()}
      <div class="gallery-nav-wrapper fade-child">
        <button class="gallery-nav-btn" id="gallery-prev" aria-label="Photo précédente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <div class="gallery-track" id="gallery-track">
          ${galleryImages.map((img,i)=>`<div class="gallery-item" data-img="${img}"><img src="${i===0?img:''}" data-src="${img}" alt="Photo ${i+1}" loading="lazy" decoding="async" ${i===0?'fetchpriority="high"':''} style="cursor:zoom-in;" onclick="openLightbox('${img}')"></div>`).join('')}
        </div>
        <button class="gallery-nav-btn" id="gallery-next" aria-label="Photo suivante">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="gallery-dots fade-child" id="gallery-dots">
        ${galleryImages.map((_,i)=>`<div class="gallery-dot${i===0?' active':''}" data-idx="${i}"></div>`).join('')}
      </div>
      <p class="gallery-hint fade-child" style="margin-top:10px;">Cliquer sur une photo pour l'agrandir</p>
    </div>`,

    // 7 — DRESS CODE
    `<div class="slide-inner">
      <span class="ornament fade-child" style="font-size:32px">✨</span>
      <p class="heading-label fade-child" style="margin-bottom:16px">Dress Code</p>
      <p class="heading-serif fade-child" style="margin-bottom:24px">Soyez Chics et Harmonisés —<br>nous publierons les photos 📸😁</p>
      ${orn()}
      <div class="card dress-card fade-child" style="display:inline-block;padding:10px 28px;">
        <p class="heading-label dress-heading" style="margin-bottom:6px;font-size:9px;">Couleurs à éviter</p>
        <p class="body-text dress-colors" style="font-size:clamp(10px,1.6vw,13px);letter-spacing:0.10em;color:#CC00CC;font-weight:500;line-height:1.5;">— ${C.forbiddenColors} —</p>
      </div>
    </div>`,

    // 8 — RSVP
    `<div class="slide-inner">
      <span class="ornament fade-child">✦</span>
      <p class="heading-names fade-child" style="font-size:clamp(36px,6vw,56px)">${C.groom} &amp; ${C.bride}</p>
      ${orn()}
      <p class="heading-serif fade-child" style="margin-bottom:24px">Nous comptons sur votre présence</p>
      <div class="card fade-child">
        <p class="body-text rsvp-text">
          Si vous ne pouvez malheureusement pas être présent(e),<br>
          merci de nous en informer avant le<br>
          <span class="gold-text" style="font-size:2em;font-family:'Cormorant Garamond',serif;font-style:italic">${C.rsvpDeadline || '31 juillet 2026'}</span>
        </p>
        ${C.rsvpContact?`<div class="ornament-line"><div class="ornament-line-dot"></div></div><p class="body-text"><span class="gold-text">${C.rsvpContact}</span></p>`:''}
        <p class="body-text" style="margin-top:8px;"><span class="gold-text">+261 38 82 678 11</span></p>      </div>
      ${orn()}
      <p class="heading-label fade-child" style="letter-spacing:0.5em;opacity:0.5">Avec tout notre amour</p>
    </div>`,

  ];

  // DOM
  const slider=document.getElementById('slider');
  const progress=document.getElementById('progress');
  const btnNext=document.getElementById('btn-next');
  const btnPrev=document.getElementById('btn-prev');
  let current=0, animating=false;

  const slideEls=slides.map((html,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(i===0?' active':'');
    el.innerHTML=html;
    slider.appendChild(el);
    return el;
  });

  slides.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.addEventListener('click',()=>goTo(i));
    progress.appendChild(dot);
  });

  function updateNav(){
    progress.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));
    btnNext.classList.toggle('hidden',current===slides.length-1);
    btnPrev.classList.toggle('hidden',current===0);
    const hint = document.getElementById('swipe-hint');
    if(hint) hint.style.opacity = current === slides.length-1 ? '0' : '';
  }

  function onSlideEnter(idx){
    if(idx===3) startCountdown();
    if(idx===5){ initGallery(); lazyLoadGallery(); setTimeout(hookGalleryCompression,300); }
  }

  function goTo(next){
    if(animating||next===current||next<0||next>=slides.length)return;
    animating=true;
    const dir=next>current?1:-1;
    const fromEl=slideEls[current], toEl=slideEls[next];

    toEl.style.transform=dir>0?'translateY(50px)':'translateY(-50px)';
    toEl.style.opacity='0';
    toEl.classList.add('active');
    toEl.getBoundingClientRect();

    fromEl.style.transition='opacity 1.1s ease, transform 1.1s ease';
    fromEl.style.opacity='0';
    fromEl.style.transform=dir>0?'translateY(-60px)':'translateY(60px)';

    toEl.style.transition='opacity 1.4s cubic-bezier(0.4,0,0.2,1), transform 1.4s cubic-bezier(0.4,0,0.2,1)';
    toEl.style.opacity='1';
    toEl.style.transform='translateY(0)';

    setTimeout(()=>{
      fromEl.classList.remove('active');
      fromEl.style.transition=fromEl.style.opacity=fromEl.style.transform='';
      toEl.style.transition='';
      current=next;
      updateNav();
      animating=false;
      onSlideEnter(current);
    },1400);
  }

  // COUNTDOWN
  let cdStarted=false;
  function startCountdown(){
    if(cdStarted)return; cdStarted=true;
    // Parse date from config — fallback: Vendredi 21 Août 2026 10h00
    const rawDate = C.ceremony.date || 'Vendredi 21 Août 2026';
    const rawTime = C.ceremony.churchTime || '10h00';
    const months={'Janvier':0,'Février':1,'Mars':2,'Avril':3,'Mai':4,'Juin':5,'Juillet':6,'Août':7,'Aout':7,'Septembre':8,'Octobre':9,'Novembre':10,'Décembre':11};
    const parts=(rawDate+' '+rawTime).split(' ');
    // parts: ["Samedi","22","Août","2026","11h00"]
    const day=parseInt(parts[1]);
    const month=months[parts[2]]??7;
    const year=parseInt(parts[3]);
    const timeParts=(parts[4]||'11h00').split(/h|:/);
    const h=parseInt(timeParts[0]), m=parseInt(timeParts[1]||0);
    const target=new Date(year,month,day,h,m,0);

    function tick(){
      const diff=target-new Date();
      if(diff<=0){['cd-days','cd-hours','cd-min','cd-sec'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='00';});return;}
      const fmt=n=>String(Math.floor(n)).padStart(2,'0');
      const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=fmt(val);};
      set('cd-days',diff/86400000);
      set('cd-hours',(diff%86400000)/3600000);
      set('cd-min',(diff%3600000)/60000);
      set('cd-sec',(diff%60000)/1000);
    }
    tick(); setInterval(tick,1000);
  }

  // GALLERY
  let galleryInited=false;
  function initGallery(){
    if(galleryInited)return; galleryInited=true;
    const track=document.getElementById('gallery-track');
    const dots=document.querySelectorAll('.gallery-dot');
    const prevBtn=document.getElementById('gallery-prev');
    const nextBtn=document.getElementById('gallery-next');
    if(!track)return;

    function getItemW(){ return (track.firstElementChild?.offsetWidth||180)+12; }
    function currentIdx(){ return Math.round(track.scrollLeft/getItemW()); }

    function updateBtns(idx){
      if(prevBtn) prevBtn.disabled=idx===0;
      if(nextBtn) nextBtn.disabled=idx>=dots.length-1;
    }

    track.addEventListener('scroll',()=>{
      const idx=currentIdx();
      dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
      updateBtns(idx);
    });
    dots.forEach(d=>{
      d.addEventListener('click',()=>{
        const idx=parseInt(d.dataset.idx);
        track.scrollTo({left:idx*getItemW(),behavior:'smooth'});
      });
    });
    if(prevBtn) prevBtn.addEventListener('click',()=>{
      const idx=Math.max(0,currentIdx()-1);
      track.scrollTo({left:idx*getItemW(),behavior:'smooth'});
    });
    if(nextBtn) nextBtn.addEventListener('click',()=>{
      const idx=Math.min(dots.length-1,currentIdx()+1);
      track.scrollTo({left:idx*getItemW(),behavior:'smooth'});
    });
    updateBtns(0);
  }

  btnNext.addEventListener('click',()=>{startAudio();goTo(current+1);});
  btnPrev.addEventListener('click',()=>{startAudio();goTo(current-1);});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')goTo(current+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')goTo(current-1);
  });

  // Init countdown on load (it's slide 4)
  setTimeout(startCountdown,200);

  updateNav();

  // AUDIO
  let started=false;
  function startAudio(){
    if(started||!C.music)return;
    started=true;
    const a=document.getElementById('bg-audio');
    if(a)a.play().catch(()=>{ started=false; }); // reset si le navigateur bloque
  }

  if(C.music){
    const audio=document.createElement('audio');
    audio.id='bg-audio'; audio.src=C.music; audio.loop=true; audio.volume=1;
    audio.preload='auto'; // commence à charger dès le départ
    document.body.appendChild(audio);
    const mb=document.createElement('button');
    mb.innerHTML='♪';
    mb.style.cssText='position:fixed;top:16px;right:16px;z-index:100;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.85);border:1px solid rgba(201,168,76,0.3);color:#9B7B2A;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;backdrop-filter:blur(4px);';
    mb.addEventListener('click',e=>{
      e.stopPropagation();
      if(!started){
        // 1er clic : on démarre seulement, sans toucher à muted
        startAudio();
      } else {
        audio.muted=!audio.muted;
        mb.innerHTML=audio.muted?'♩':'♪';
        mb.style.opacity=audio.muted?'0.4':'1';
      }
    });
    document.body.appendChild(mb);
  }

  // LIGHTBOX avec navigation prev/next
  const galleryImagesArr = C.galleryImages || [
    'DSC08336.jpg','DSC08355.jpg','DSC08592.jpg','DSC08776.jpg',
    'DSC08875.jpg','DSC08913.jpg','DSC09029.jpg','DSC08335.jpg',
    'DSC08419.jpg','DSC08748.jpg','DSC08753.jpg'
  ];
  let lbCurrent = 0;

  function updateLightbox(idx){
    idx = Math.max(0, Math.min(galleryImagesArr.length-1, idx));
    lbCurrent = idx;
    const lbImg = document.getElementById('lightbox-img');
    const lbCounter = document.getElementById('lightbox-counter');
    const lbPrev = document.getElementById('lightbox-prev');
    const lbNext = document.getElementById('lightbox-next');

    // Forcer le chargement si l'image n'a pas encore été lazy-loadée
    const thumbImg = document.querySelectorAll('.gallery-item img')[idx];
    if(thumbImg){
      const realSrc = thumbImg.dataset.src || thumbImg.src;
      if(thumbImg.dataset.src){
        // Déclencher le chargement dans la vignette aussi
        thumbImg.src = realSrc;
        thumbImg.removeAttribute('data-src');
      }
      lbImg.src = realSrc;
    } else {
      lbImg.src = galleryImagesArr[idx];
    }

    lbCounter.textContent = (idx+1) + ' / ' + galleryImagesArr.length;
    if(lbPrev) lbPrev.disabled = idx === 0;
    if(lbNext) lbNext.disabled = idx === galleryImagesArr.length - 1;
  }

  window.openLightbox = function(src) {
    const idx = galleryImagesArr.indexOf(src);
    updateLightbox(idx >= 0 ? idx : 0);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', e => {
    if(e.target === e.currentTarget) closeLightbox();
  });
  const lbPrevBtn = document.getElementById('lightbox-prev');
  const lbNextBtn = document.getElementById('lightbox-next');
  if(lbPrevBtn) lbPrevBtn.addEventListener('click', e => { e.stopPropagation(); updateLightbox(lbCurrent-1); });
  if(lbNextBtn) lbNextBtn.addEventListener('click', e => { e.stopPropagation(); updateLightbox(lbCurrent+1); });

  document.addEventListener('keydown', e => {
    const lb = document.getElementById('lightbox');
    if(!lb.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft')  updateLightbox(lbCurrent-1);
    if(e.key === 'ArrowRight') updateLightbox(lbCurrent+1);
  });

  // LAZY LOADING — charge seulement 2 images en avance, pas toutes d'un coup
  function lazyLoadGallery() {
    const items = document.querySelectorAll('.gallery-item');
    if(!items.length) return;
    const track = document.getElementById('gallery-track');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;
        const img = entry.target.querySelector('img[data-src]');
        if(img){
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          img.addEventListener('load', ()=>compressImg(img), {once:true});
        }
        obs.unobserve(entry.target);
      });
    }, { root: track, rootMargin: '0px 320px 0px 0px' }); // charge 2 images en avance max
    items.forEach(item => obs.observe(item));
  }

  // COMPRESSION — réduit à max 480px (miniatures galerie), qualité 0.55
  function compressImg(img){
    try{
      if(!img.naturalWidth) return;
      const MAX = 480;
      let w = img.naturalWidth, h = img.naturalHeight;
      const ratio = Math.min(MAX/w, MAX/h, 1);
      if(ratio >= 1) return; // déjà petite
      w = Math.round(w*ratio); h = Math.round(h*ratio);
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      img.src = c.toDataURL('image/jpeg', 0.55);
    }catch(e){}
  }
  function hookGalleryCompression(){
    document.querySelectorAll('.gallery-item img').forEach(img=>{
      if(img.complete && img.naturalWidth>0) compressImg(img);
      else img.addEventListener('load',()=>compressImg(img),{once:true});
    });
  }

})();
</script>
