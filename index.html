<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Invitation — Tsiry & Jinny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<script src="config.js"></script>

<style>
  /* ===================== RESET & BASE ===================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white:      #FDFCF8;
    --cream:      #F5F0E8;
    --gold:       #C9A84C;
    --gold-light: #E2C97E;
    --gold-pale:  #F0E4C2;
    --gold-deep:  #9B7B2A;
    --text-dark:  #1A1612;
    --text-mid:   #4A3F32;
    --text-light: #8A7A6A;
    --border:     rgba(201,168,76,0.25);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--white);
    font-family: 'Jost', sans-serif;
    color: var(--text-dark);
  }

  /* ===================== BACKGROUND TEXTURE ===================== */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ===================== SLIDER ===================== */
  #slider {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 32px 160px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    transform: translateY(40px);
    transition:
      opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .slide.exit-up {
    opacity: 0;
    transform: translateY(-50px);
    pointer-events: none;
  }

  .slide-inner {
    max-width: 680px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  /* ===================== ORNAMENTS ===================== */
  .ornament {
    display: block;
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 0.3em;
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .ornament-line {
    display: flex; align-items: center; gap: 16px;
    margin: 24px auto;
    max-width: 320px;
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .ornament-line-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(201,168,76,0.6);
  }

  /* ===================== TYPOGRAPHY ===================== */
  .heading-names {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(60px, 11vw, 96px);
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--text-dark);
  }

  .heading-names .amp {
    font-style: italic;
    color: var(--gold);
    font-size: 0.75em;
    display: block;
    line-height: 1.3;
  }

  .heading-serif {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 3.4vw, 27px);
    font-weight: 500;
    font-style: italic;
    color: var(--text-mid);
    line-height: 1.6;
  }

  .heading-label {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }

  .body-text {
    font-family: 'Jost', sans-serif;
    font-size: clamp(15px, 2.5vw, 17px);
    font-weight: 400;
    line-height: 1.85;
    color: var(--text-mid);
  }

  .family-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18.5px, 2.5vw, 27px);
    font-weight: 500;
    line-height: 1.7;
    color: var(--text-mid);
    white-space: pre-line;
  }

  .gold-text {
    color: var(--gold-deep);
    font-weight: 600;
  }

  .big-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 5.5vw, 50px);
    font-weight: 500;
    color: var(--text-dark);
    letter-spacing: 0.05em;
  }

  /* ===================== CARDS ===================== */
  .card {
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px 36px;
    position: relative;
    backdrop-filter: blur(4px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 1px;
    pointer-events: none;
  }

  /* ===================== FAMILY GRID ===================== */
  .family-grid {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 0 32px;
    text-align: left;
    margin: 24px 0;
  }

  .family-divider {
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }

  .family-side { padding: 8px 0; }

  .family-role {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 6px;
    opacity: 0.8;
  }

  /* ===================== CHECKLIST ===================== */
  .checklist {
    list-style: none;
    text-align: left;
    display: inline-block;
    margin: 16px auto 0;
  }

  .checklist li {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
    font-family: 'Jost', sans-serif;
    font-size: clamp(13px, 2.2vw, 15px);
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.5;
  }

  .checklist li .icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: var(--gold);
    margin-top: 0;
  }

  /* ===================== EVENT BLOCK ===================== */
  .event-block {
    padding: 20px 0;
  }

  .event-block + .event-block {
    border-top: 1px solid var(--border);
  }

  /* ===================== NAV ===================== */
  #nav {
    position: fixed;
    bottom: 36px;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #progress {
    display: flex; gap: 8px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-pale);
    transition: all 0.4s ease;
    cursor: pointer;
  }

  .dot.active {
    background: var(--gold);
    width: 22px;
    border-radius: 3px;
  }

  #btn-next {
    display: flex; align-items: center; gap: 10px;
    background: var(--text-dark);
    color: var(--gold-pale);
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  #btn-prev {
    display: flex; align-items: center; gap: 10px;
    background: #FDFCF8;
    color: var(--text-dark);
    border: 1px solid rgba(26,22,18,0.2);
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 14px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #btn-prev:hover {
    border-color: var(--text-dark);
    background: var(--cream);
  }

  #btn-prev.hidden {
    opacity: 0;
    pointer-events: none;
  }


    content: '';
    position: absolute; inset: 0;
    background: var(--gold);
    transform: translateX(-101%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
  }

  #btn-next:hover::before { transform: translateX(0); }

  #btn-next span, #btn-next svg {
    position: relative; z-index: 1;
  }

  #btn-next:hover { color: var(--text-dark); }

  #btn-next.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
  }

  .arrow-icon {
    width: 14px; height: 14px;
    transition: transform 0.3s ease;
  }

  #btn-next:hover .arrow-icon {
    transform: translateX(4px);
  }

  /* ===================== SLIDE 1 — COVER ===================== */
  #slide-1 .heading-names {
    animation: none;
  }

  .cover-badge {
    display: inline-block;
    padding: 6px 20px;
    border: 1px solid var(--border);
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 32px;
    background: rgba(201,168,76,0.04);
  }

  /* ===================== GOLD HIGHLIGHT ===================== */
  .highlight-gold {
    display: inline-block;
    position: relative;
  }
  .highlight-gold::after {
    content: '';
    position: absolute;
    bottom: 2px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 540px) {
    .slide {
      padding: 24px 16px 140px;
      align-items: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .slide-inner { padding-top: 16px; }
    .family-grid {
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    .family-divider { display: none; }
    .family-side { text-align: center; }
    .family-role { text-align: center; }
    .family-text { font-size: 12px; }
    .card { padding: 20px 16px; }
    .heading-serif { font-size: clamp(16px, 3.5vw, 22px); }
  }

  @media (max-width: 360px) {
    .family-grid { grid-template-columns: 1fr; gap: 16px; }
    .family-side { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .family-side:last-child { border-bottom: none; }
  }

  /* ===================== SCROLL HINT ===================== */
  .swipe-hint {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-deep);
    opacity: 0.5;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="slider"></div>

<nav id="nav">
  <div id="progress"></div>
  <div style="display:flex;gap:12px;align-items:center;">
    <button id="btn-prev">
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M11 18l-6-6 6-6"/>
      </svg>
      <span>Précédent</span>
    </button>
    <button id="btn-next">
      <span>Suivant</span>
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>
  </div>
  <div class="swipe-hint">Cliquez pour continuer</div>
</nav>

<script>
// ============================================================
//  SLIDES ENGINE
// ============================================================
(function() {
  const C = WEDDING_CONFIG;

  // ---- Build slide HTML ----
  function orn() {
    return `<div class="ornament-line"><div class="ornament-line-dot"></div></div>`;
  }

  const slides = [

    // SLIDE 1 — Cover
    `<div class="slide-inner" style="position:relative;">
      ${C.coverImage ? `
      <div style="
        position:fixed; inset:0; z-index:-1;
        background-image: url('${C.coverImage}');
        background-size: cover;
        background-size: contain;
        opacity: 0.13;
        filter: grayscale(30%);
      "></div>` : ''}
      <div class="cover-badge">Invitation</div>
      <div class="heading-names">
        ${C.groom}<br>
        <span class="amp">&amp;</span>
        ${C.bride}
      </div>
      ${orn()}
      <p class="heading-label" style="margin-top:8px;margin-bottom:20px;font-size:15px;letter-spacing:0.25em;">Nous vous convions à notre célébration</p>
      <blockquote style="
        max-width:480px;margin:0 auto;
        font-family:'Cormorant Garamond',serif;
        font-size:clamp(15px,2.5vw,18px);
        font-style:italic;
        font-weight:400;
        color:var(--text-mid);
        line-height:1.9;
        border-left:2px solid var(--gold);
        padding:14px 0 14px 22px;
        text-align:left;
      ">
        « L'amour est patient, l'amour est serviable. Il n'est ni envieux, ni porté à l'orgueil. Il ne se vante pas, ne se gonfle pas d'orgueil, ne fait rien d'inconvenant, ne cherche pas son intérêt, ne s'irrite pas, ne garde pas souvenir du mal… »
        <br><span style="display:block;margin-top:10px;font-style:normal;font-size:0.85em;letter-spacing:0.15em;color:var(--gold-deep);">— 1 Corinthiens 13, 4‑7</span>
      </blockquote>
    </div>`,

    // SLIDE 2 — Familles
    `<div class="slide-inner">
      <div class="card">
        <div style="display:grid;grid-template-rows:auto auto auto;grid-template-columns:1fr 1px 1fr;gap:0 32px;text-align:left;margin:24px 0;align-items:start;">

          <!-- parents gauche -->
          <div style="padding:8px 0;grid-column:1;grid-row:1;">
            <div class="family-role">Côté marié</div>
            <p class="family-text">${C.families.left.parents}</p>
          </div>

          <!-- divider vertical -->
          <div style="grid-column:2;grid-row:1/4;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0.4;"></div>

          <!-- parents droite -->
          <div style="padding:8px 0;grid-column:3;grid-row:1;">
            <div class="family-role">Côté mariée</div>
            <p class="family-text">${C.families.right.parents}</p>
          </div>

          <!-- separateur gauche -->
          <div style="grid-column:1;grid-row:2;">${orn()}</div>

          <!-- separateur droite -->
          <div style="grid-column:3;grid-row:2;">${orn()}</div>

          <!-- enfants gauche -->
          <div style="grid-column:1;grid-row:3;padding:0 0 8px;">
            <p class="family-text" style="font-style:italic">${C.families.left.child}</p>
            <p class="family-text" style="font-style:italic">${C.families.left.partner}</p>
          </div>

          <!-- enfants droite -->
          <div style="grid-column:3;grid-row:3;padding:0 0 8px;">
            <p class="family-text" style="font-style:italic">${C.families.right.child}</p>
            <p class="family-text" style="font-style:italic">${C.families.right.partner}</p>
          </div>

        </div>
        ${orn()}
        <p class="heading-serif" style="font-size:clamp(22px,3.2vw,30px);font-style:normal;font-weight:500;color:var(--text-dark);line-height:1.7;">Ont l'honneur de vous inviter à la bénédiction et à la sacralisation par le mariage religieux de leurs enfants et petits-enfants,</p>
        <p class="heading-names" style="font-size:clamp(36px,6vw,56px);margin-top:16px">${C.groom} <span class="amp" style="display:inline;font-size:0.75em">&amp;</span> ${C.bride}</p>
      </div>
    </div>`,

    // SLIDE 3 — Date & Lieu
    `<div class="slide-inner">
      <span class="ornament">✦</span>
      <p class="heading-label" style="margin-bottom:24px">Au programme</p>
      <div class="card">
        <div class="event-block">
          <p class="heading-label" style="margin-bottom:12px">La Sacralisation</p>
          <p class="big-date">${C.ceremony.date}</p>
          <p class="body-text" style="margin-top:12px">
            <span class="gold-text">${C.ceremony.church}</span><br>
            à ${C.ceremony.churchTime}
          </p>
        </div>
        <div class="event-block">
          <p class="heading-label" style="margin-bottom:12px">La Réception</p>
          <p class="body-text">
            <span class="gold-text">${C.reception.venue}</span><br>
            à ${C.reception.time}
          </p>
        </div>
      </div>
    </div>`,

    // SLIDE 4 — Préparez-vous
    `<div class="slide-inner">
      <p class="heading-label" style="margin-bottom:8px">Ce qu'il faut préparer</p>
      ${orn()}
      <ul class="checklist">
        <li>
          <div class="icon">🍽</div>
          <div><strong class="gold-text">Votre estomac</strong><br>Car il y aura à manger</div>
        </li>
        <li>
          <div class="icon">💃</div>
          <div><strong class="gold-text">Votre corps</strong><br>Car il faudra danser</div>
        </li>
        <li>
          <div class="icon">✨</div>
          <div><strong class="gold-text">Votre joie de vivre</strong><br>Car nous allons célébrer</div>
        </li>
      </ul>
    </div>`,

    // SLIDE 5 — Dress code
    `<div class="slide-inner">
      <span class="ornament" style="font-size:32px">✨</span>
      <p class="heading-label" style="margin-bottom:16px">Dress Code</p>
      <p class="heading-serif" style="margin-bottom:24px">Soyez Chics et Harmonisés —<br>nous publierons les photos 📸😁</p>
      ${orn()}
      <div class="card" style="display:inline-block;padding:16px 40px;">
        <p class="heading-label" style="margin-bottom:8px">Couleurs à éviter</p>
        <p class="body-text" style="font-size:8px;letter-spacing:0.15em;color:#FF00FF;font-weight:500;">— ${C.forbiddenColors} —</p>
      </div>
    </div>`,

    // SLIDE 6 — RSVP / Fin
    `<div class="slide-inner">
      <span class="ornament">✦</span>
      <p class="heading-names" style="font-size:clamp(36px,6vw,56px)">${C.groom} &amp; ${C.bride}</p>
      ${orn()}
      <p class="heading-serif" style="margin-bottom:24px">Nous comptons sur votre présence</p>
      <div class="card">
        <p class="body-text">
          Si vous ne pouvez malheureusement pas être présent(e),<br>
          merci de nous en informer avant le<br>
          <span class="gold-text" style="font-size:2em;font-family:'Cormorant Garamond',serif;font-style:italic">${C.rsvpDeadline}</span>
        </p>
        ${C.rsvpContact ? `<div class="ornament-line"><div class="ornament-line-dot"></div></div>
        <p class="body-text"><span class="gold-text">${C.rsvpContact}</span></p>` : ''}
      </div>
      ${orn()}
      <p class="heading-label" style="letter-spacing:0.5em; opacity:0.5">Avec tout notre amour</p>
    </div>`,

  ];

  // ---- DOM Setup ----
  const slider = document.getElementById('slider');
  const progress = document.getElementById('progress');
  const btnNext = document.getElementById('btn-next');
  const btnPrev = document.getElementById('btn-prev');
  let current = 0;
  let animating = false;

  // Create slide elements
  const slideEls = slides.map((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    slider.appendChild(el);
    return el;
  });

  // Create progress dots
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    progress.appendChild(dot);
  });

  function updateNav() {
    const dots = progress.querySelectorAll('.dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    btnNext.classList.toggle('hidden', current === slides.length - 1);
    btnPrev.classList.toggle('hidden', current === 0);
  }

  function goTo(next) {
    if (animating || next === current || next < 0 || next >= slides.length) return;
    animating = true;

    const direction = next > current ? 1 : -1;
    const fromEl = slideEls[current];
    const toEl   = slideEls[next];

    // Prepare incoming slide below
    toEl.style.transform = direction > 0 ? 'translateY(40px)' : 'translateY(-40px)';
    toEl.style.opacity = '0';
    toEl.classList.remove('exit-up');
    toEl.classList.add('active');

    // Force reflow
    toEl.getBoundingClientRect();

    // Animate both
    fromEl.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
    fromEl.style.opacity = '0';
    fromEl.style.transform = direction > 0 ? 'translateY(-50px)' : 'translateY(50px)';

    toEl.style.transition = 'opacity 0.85s cubic-bezier(0.4,0,0.2,1), transform 0.85s cubic-bezier(0.4,0,0.2,1)';
    toEl.style.opacity = '1';
    toEl.style.transform = 'translateY(0)';

    setTimeout(() => {
      fromEl.classList.remove('active');
      fromEl.style.transition = '';
      fromEl.style.opacity = '';
      fromEl.style.transform = '';
      toEl.style.transition = '';
      current = next;
      updateNav();
      animating = false;
    }, 900);
  }

  btnNext.addEventListener('click', () => { startAudio(); goTo(current + 1); });
  btnPrev.addEventListener('click', () => { startAudio(); goTo(current - 1); });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
  });

  updateNav();

  // ---- Audio ----
  let started = false;
  function startAudio() {
    if (started || !C.music) return;
    started = true;
    const audio = document.getElementById('bg-audio');
    if (audio) audio.play().catch(() => {});
  }

  if (C.music) {
    const audio = document.createElement('audio');
    audio.id = 'bg-audio';
    audio.src = C.music;
    audio.loop = true;
    audio.volume = 2;
    document.body.appendChild(audio);

    const muteBtn = document.createElement('button');
    muteBtn.innerHTML = '♪';
    muteBtn.title = 'Couper / Activer la musique';
    muteBtn.style.cssText = `
      position:fixed; top:16px; right:16px; z-index:100;
      width:32px; height:32px; border-radius:50%;
      background:rgba(255,255,255,0.85); border:1px solid rgba(201,168,76,0.3);
      color:#9B7B2A; font-size:13px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.3s ease; backdrop-filter:blur(4px);
    `;
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startAudio();
      audio.muted = !audio.muted;
      muteBtn.innerHTML = audio.muted ? '♩' : '♪';
      muteBtn.style.opacity = audio.muted ? '0.4' : '1';
    });
    document.body.appendChild(muteBtn);
  }

})();
</script>
</body>
</html>
